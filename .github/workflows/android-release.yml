name: Build Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install JS dependencies (root and frontend)
        run: |
          if [ -f package.json ]; then
            npm ci --prefer-offline --no-audit --no-fund || npm install
          fi
          if [ -d frontend ]; then
            cd frontend
            if [ -f package.json ]; then
              npm ci --prefer-offline --no-audit --no-fund || npm install
            fi
            cd ..
          fi

      - name: Decode release keystore (if provided)
        if: secrets.ANDROID_KEYSTORE_B64 != ''
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "Decoding keystore to android/app/release.keystore"
          mkdir -p android/app
          echo "$KEY_B64" | base64 --decode > android/app/release.keystore
          ls -la android/app || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon

      - name: List produced APK(s)
        run: ls -la android/app/build/outputs/apk/release || true

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
