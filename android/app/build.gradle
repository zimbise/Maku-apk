apply plugin: 'com.android.application'

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.zimbuss.maku"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    // Signing configs: uses android/app/release.keystore when present and
    // reads passwords/alias from environment variables (CI secrets).
    signingConfigs {
        release {
            def keystoreFile = file('release.keystore')
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                if (System.getenv("ANDROID_KEYSTORE_PASSWORD") != null) {
                    storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                }
                if (System.getenv("ANDROID_KEY_ALIAS") != null) {
                    keyAlias System.getenv("ANDROID_KEY_ALIAS")
                }
                if (System.getenv("ANDROID_KEY_PASSWORD") != null) {
                    keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                }
            }
        }
        debug {
            // Gradle will create a debug keystore automatically if one is not present.
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // If a release.keystore file exists we use it, otherwise fall back to debug signing.
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}
